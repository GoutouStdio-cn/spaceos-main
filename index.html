<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<body class="bg-gradient-to-b from-blue-900 via-blue-700 to-gray-800 text-gray-800 min-h-screen font-['Segoe_UI'] cursor-default select-none overflow-hidden" id="app-body">
    <!-- 动态背景 -->
    <div class="fixed inset-0 z-0 bg-gradient-to-br from-blue-900 via-purple-900 to-gray-900">

<script>
// 优化性能：模块化组织代码
(function() {
    'use strict';
    
    // 更新时间：2026年5月2日 16:00 (UTC+8)
    const targetDate = new Date(2026, 4, 2, 16, 0, 0).getTime();
    
    // DOM元素缓存
    const elements = {
        days: document.getElementById('days'),
        hours: document.getElementById('hours'),
        minutes: document.getElementById('minutes'),
        seconds: document.getElementById('seconds'),
        mainWindow: document.getElementById('main-window'),
        titlebar: document.getElementById('window-titlebar'),
        currentTime: document.getElementById('current-time'),
        closeBtn: document.getElementById('close-btn'),
        minimizeBtn: document.getElementById('minimize-btn'),
        maximizeBtn: document.getElementById('maximize-btn'),
        reopenButton: document.getElementById('reopen-button'),
        resizeHandle: document.getElementById('resize-handle'),
        appBody: document.getElementById('app-body')
    };
    
    // 状态管理
    let state = {
        isDragging: false,
        isResizing: false,
        dragOffset: { x: 0, y: 0 },
        resizeStart: { x: 0, y: 0, width: 0, height: 0 },
        windowPosition: { x: 0, y: 0 },
        windowSize: { width: 500, height: 580 },
        windowClosed: false,
        animationFrameId: null,
        countdownInterval: null,
        timeInterval: null,
        previousValues: {
            days: '00',
            hours: '00',
            minutes: '00',
            seconds: '00'
        }
    };
    
    // 初始化函数
    function init() {
        // 修复：确保窗口在屏幕中央，完全在可视区域内
        centerWindow();
        
        // 初始化事件监听器
        setupEventListeners();
        
        // 启动定时器
        startIntervals();
        
        // 初始动画
        requestAnimationFrame(() => {
            elements.mainWindow.style.opacity = '1';
            elements.mainWindow.style.transform = 'scale(1)';
        });
    }
    
    // 居中窗口 - 修复溢出问题
    function centerWindow() {
        // 确保窗口尺寸不会超过屏幕
        const maxWidth = Math.min(state.windowSize.width, window.innerWidth - 40);
        const maxHeight = Math.min(state.windowSize.height, window.innerHeight - 40);
        
        state.windowSize.width = maxWidth;
        state.windowSize.height = maxHeight;
        
        // 计算中心位置，考虑窗口边框
        const centerX = Math.max(20, (window.innerWidth - state.windowSize.width) / 2);
        const centerY = Math.max(20, (window.innerHeight - state.windowSize.height) / 2);
        
        state.windowPosition = { x: centerX, y: centerY };
        
        // 应用位置和尺寸
        elements.mainWindow.style.width = `${state.windowSize.width}px`;
        elements.mainWindow.style.height = `${state.windowSize.height}px`;
        elements.mainWindow.style.left = `${state.windowPosition.x}px`;
        elements.mainWindow.style.top = `${state.windowPosition.y}px`;
    }
    
    // 确保窗口在边界内
    function ensureWindowInBounds() {
        // 考虑最小尺寸和边界安全距离
        const minWidth = 400;
        const minHeight = 400;
        const safeMargin = 20;
        
        // 限制窗口尺寸
        state.windowSize.width = Math.max(minWidth, 
            Math.min(state.windowSize.width, window.innerWidth - safeMargin));
        state.windowSize.height = Math.max(minHeight, 
            Math.min(state.windowSize.height, window.innerHeight - safeMargin));
        
        // 限制窗口位置
        const maxX = window.innerWidth - state.windowSize.width - safeMargin;
        const maxY = window.innerHeight - state.windowSize.height - safeMargin;
        
        state.windowPosition.x = Math.max(safeMargin, 
            Math.min(state.windowPosition.x, maxX));
        state.windowPosition.y = Math.max(safeMargin, 
            Math.min(state.windowPosition.y, maxY));
        
        // 应用修正
        elements.mainWindow.style.width = `${state.windowSize.width}px`;
        elements.mainWindow.style.height = `${state.windowSize.height}px`;
        elements.mainWindow.style.left = `${state.windowPosition.x}px`;
        elements.mainWindow.style.top = `${state.windowPosition.y}px`;
    }
    
    // 更新当前时间
    function updateCurrentTime() {
        const now = new Date();
        const timeString = now.toLocaleTimeString('zh-CN', { 
            hour12: false,
            hour: '2-digit',
            minute: '2-digit',
            second: '2-digit'
        });
        elements.currentTime.textContent = timeString;
    }
    
    // 更新倒计时
    function updateCountdown() {
        try {
            const now = Date.now();
            const distance = targetDate - now;
            
            if (distance <= 0) {
                if (state.countdownInterval) clearInterval(state.countdownInterval);
                ['days', 'hours', 'minutes', 'seconds'].forEach(id => {
                    elements[id].textContent = '00';
                });
                
                const titleElement = document.querySelector('h1');
                if (titleElement) {
                    titleElement.innerHTML = '<i class="fa fa-check-circle mr-3 text-green-300"></i>SpaceOS 6 已发布！';
                }
                return;
            }
            
            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);
            
            const formattedDays = days.toString().padStart(2, '0');
            const formattedHours = hours.toString().padStart(2, '0');
            const formattedMinutes = minutes.toString().padStart(2, '0');
            const formattedSeconds = seconds.toString().padStart(2, '0');
            
            // 仅当值变化时更新DOM
            if (formattedDays !== state.previousValues.days) {
                elements.days.textContent = formattedDays;
                state.previousValues.days = formattedDays;
                animateElement(elements.days);
            }
            
            if (formattedHours !== state.previousValues.hours) {
                elements.hours.textContent = formattedHours;
                state.previousValues.hours = formattedHours;
                animateElement(elements.hours);
            }
            
            if (formattedMinutes !== state.previousValues.minutes) {
                elements.minutes.textContent = formattedMinutes;
                state.previousValues.minutes = formattedMinutes;
                animateElement(elements.minutes);
            }
            
            if (formattedSeconds !== state.previousValues.seconds) {
                elements.seconds.textContent = formattedSeconds;
                state.previousValues.seconds = formattedSeconds;
                animateElement(elements.seconds);
            }
        } catch (error) {
            console.error('更新倒计时时出错:', error);
        }
    }
    
    // 元素动画
    function animateElement(element) {
        element.style.transform = 'scale(1.15)';
        setTimeout(() => {
            element.style.transform = 'scale(1)';
        }, 200);
    }
    
    // 窗口拖拽逻辑
    function startDrag(e) {
        // 只允许标题栏拖动
        if (!e.target.closest('#window-titlebar')) return;
        
        state.isDragging = true;
        const rect = elements.mainWindow.getBoundingClientRect();
        
        const clientX = e.clientX || e.touches[0].clientX;
        const clientY = e.clientY || e.touches[0].clientY;
        
        state.dragOffset.x = clientX - rect.left;
        state.dragOffset.y = clientY - rect.top;
        
        elements.mainWindow.style.transition = 'none';
        elements.appBody.style.cursor = 'move';
        
        // 立即开始拖拽
        updateWindowPosition(clientX, clientY);
    }
    
    function updateWindowPosition(x, y) {
        if (!state.isDragging) return;
        
        state.windowPosition.x = x - state.dragOffset.x;
        state.windowPosition.y = y - state.dragOffset.y;
        
        // 使用requestAnimationFrame平滑更新
        if (state.animationFrameId) {
            cancelAnimationFrame(state.animationFrameId);
        }
        
        state.animationFrameId = requestAnimationFrame(() => {
            elements.mainWindow.style.left = `${state.windowPosition.x}px`;
            elements.mainWindow.style.top = `${state.windowPosition.y}px`;
        });
    }
    
    function endDrag() {
        if (!state.isDragging) return;
        
        state.isDragging = false;
        elements.appBody.style.cursor = 'default';
        elements.mainWindow.style.transition = 'all 0.2s ease-out';
        
        // 确保窗口在边界内
        ensureWindowInBounds();
        
        if (state.animationFrameId) {
            cancelAnimationFrame(state.animationFrameId);
            state.animationFrameId = null;
        }
    }
    
    // 窗口调整大小逻辑
    function startResize(e) {
        state.isResizing = true;
        const rect = elements.mainWindow.getBoundingClientRect();
        
        state.resizeStart = {
            x: e.clientX,
            y: e.clientY,
            width: rect.width,
            height: rect.height
        };
        
        elements.mainWindow.style.transition = 'none';
        elements.appBody.style.cursor = 'se-resize';
        
        e.preventDefault();
    }
    
    function updateResize(e) {
        if (!state.isResizing) return;
        
        const deltaX = e.clientX - state.resizeStart.x;
        const deltaY = e.clientY - state.resizeStart.y;
        
        state.windowSize.width = Math.max(400, state.resizeStart.width + deltaX);
        state.windowSize.height = Math.max(400, state.resizeStart.height + deltaY);
        
        // 使用requestAnimationFrame平滑更新
        if (state.animationFrameId) {
            cancelAnimationFrame(state.animationFrameId);
        }
        
        state.animationFrameId = requestAnimationFrame(() => {
            elements.mainWindow.style.width = `${state.windowSize.width}px`;
            elements.mainWindow.style.height = `${state.windowSize.height}px`;
        });
        
        e.preventDefault();
    }
    
    function endResize() {
        if (!state.isResizing) return;
        
        state.isResizing = false;
        elements.appBody.style.cursor = 'default';
        elements.mainWindow.style.transition = 'all 0.2s ease-out';
        
        // 确保窗口在边界内
        ensureWindowInBounds();
        
        if (state.animationFrameId) {
            cancelAnimationFrame(state.animationFrameId);
            state.animationFrameId = null;
        }
    }
    
    // 窗口控制功能
    function closeWindow() {
        if (state.windowClosed) return;
        
        elements.mainWindow.style.opacity = '0';
        elements.mainWindow.style.transform = 'scale(0.95)';
        
        setTimeout(() => {
            elements.reopenButton.style.opacity = '1';
            elements.reopenButton.style.pointerEvents = 'all';
            elements.reopenButton.style.transform = 'translateY(0)';
            state.windowClosed = true;
        }, 300);
    }
    
    function minimizeWindow() {
        elements.mainWindow.style.opacity = '0.7';
        elements.mainWindow.style.transform = 'scale(0.98)';
        setTimeout(() => {
            elements.mainWindow.style.opacity = '1';
            elements.mainWindow.style.transform = 'scale(1)';
        }, 300);
    }
    
    function maximizeWindow() {
        const isMaximized = elements.mainWindow.style.width === 'calc(100vw - 40px)';
        
        if (isMaximized) {
            // 恢复原始大小
            state.windowSize = { width: 500, height: 580 };
            centerWindow();
            elements.maximizeBtn.innerHTML = '<i class="fa fa-square-o"></i>';
        } else {
            // 最大化
            state.windowSize = { 
                width: window.innerWidth - 40, 
                height: window.innerHeight - 40 
            };
            state.windowPosition = { x: 20, y: 20 };
            
            elements.mainWindow.style.width = `${state.windowSize.width}px`;
            elements.mainWindow.style.height = `${state.windowSize.height}px`;
            elements.mainWindow.style.left = `${state.windowPosition.x}px`;
            elements.mainWindow.style.top = `${state.windowPosition.y}px`;
            elements.maximizeBtn.innerHTML = '<i class="fa fa-window-restore"></i>';
        }
    }
    
    // 重新打开窗口 - 修复溢出问题
    function reopenWindow() {
        if (!state.windowClosed) return;
        
        elements.reopenButton.style.opacity = '0';
        elements.reopenButton.style.pointerEvents = 'none';
        elements.reopenButton.style.transform = 'translateY(5px)';
        
        // 重新居中窗口，确保不会溢出
        centerWindow();
        
        elements.mainWindow.style.opacity = '1';
        elements.mainWindow.style.transform = 'scale(1)';
        state.windowClosed = false;
    }
    
    // 设置事件监听器
    function setupEventListeners() {
        // 窗口拖拽
        elements.titlebar.addEventListener('mousedown', startDrag);
        elements.titlebar.addEventListener('touchstart', startDrag);
        
        // 窗口调整大小
        elements.resizeHandle.addEventListener('mousedown', startResize);
        
        // 鼠标移动事件
        document.addEventListener('mousemove', (e) => {
            if (state.isDragging) updateWindowPosition(e.clientX, e.clientY);
            if (state.isResizing) updateResize(e);
        });
        
        document.addEventListener('touchmove', (e) => {
            if (!e.touches.length) return;
            if (state.isDragging) updateWindowPosition(e.touches[0].clientX, e.touches[0].clientY);
            if (state.isResizing) updateResize(e);
            e.preventDefault();
        });
        
        // 结束事件
        document.addEventListener('mouseup', () => {
            endDrag();
            endResize();
        });
        
        document.addEventListener('touchend', () => {
            endDrag();
            endResize();
        });
        
        // 窗口控制
        elements.closeBtn.addEventListener('click', closeWindow);
        elements.minimizeBtn.addEventListener('click', minimizeWindow);
        elements.maximizeBtn.addEventListener('click', maximizeWindow);
        elements.reopenButton.addEventListener('click', reopenWindow);
        
        // 键盘快捷键
        document.addEventListener('keydown', (e) => {
            if (e.ctrlKey && e.key === 'w') {
                if (!state.windowClosed) closeWindow();
                else reopenWindow();
                e.preventDefault();
            }
            
            if (e.key === 'Escape') {
                if (!state.windowClosed) closeWindow();
                else reopenWindow();
            }
            
            // 双击标题栏最大化/还原
            if (e.ctrlKey && e.altKey && e.key === 'ArrowUp') {
                maximizeWindow();
            }
        });
        
        // 双击标题栏最大化/还原
        elements.titlebar.addEventListener('dblclick', maximizeWindow);
        
        // 窗口调整大小事件
        let resizeTimeout;
        window.addEventListener('resize', () => {
            clearTimeout(resizeTimeout);
            resizeTimeout = setTimeout(() => {
                ensureWindowInBounds();
            }, 100);
        });
        
        // Vista风格的窗口激活效果
        elements.mainWindow.addEventListener('mousedown', () => {
            elements.mainWindow.style.zIndex = '40';
        });
    }
    
    // 启动定时器
    function startIntervals() {
        // 初始更新
        updateCountdown();
        updateCurrentTime();
        
        // 设置定时器
        state.countdownInterval = setInterval(updateCountdown, 1000);
        state.timeInterval = setInterval(updateCurrentTime, 1000);
    }
    
    // 初始化应用
    document.addEventListener('DOMContentLoaded', init);
})();
</script>
</body>
</html>
