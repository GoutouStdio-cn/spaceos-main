<script>
// 优化性能：使用模块化方式组织代码，减少全局变量
(function() {
    'use strict';
    
    // 更新时间：2026年5月2日 16:00 (UTC+8)
    const targetDate = new Date(2026, 4, 2, 16, 0, 0).getTime();
    
    // DOM元素缓存
    const elements = {
        days: document.getElementById('days'),
        hours: document.getElementById('hours'),
        minutes: document.getElementById('minutes'),
        seconds: document.getElementById('seconds'),
        bubblesContainer: document.getElementById('bubbles-container'),
        rippleContainer: document.getElementById('ripple-container'),
        appBody: document.getElementById('app-body'),
        bgImage: document.querySelector('.fixed img'),
        mainWindow: document.getElementById('main-window'),
        titlebar: document.getElementById('window-titlebar'),
        currentTime: document.getElementById('current-time'),
        closeBtn: document.getElementById('close-btn'),
        reopenButton: document.getElementById('reopen-button'),
        taskbarHint: document.getElementById('taskbar-hint')
    };
    
    // 状态管理
    let state = {
        isDragging: false,
        dragOffset: { x: 0, y: 0 },
        windowPosition: { x: 0, y: 0 },
        windowClosed: false,
        animationFrameId: null,
        countdownInterval: null,
        timeInterval: null,
        bubbleInterval: null,
        previousValues: {
            days: '00',
            hours: '00',
            minutes: '00',
            seconds: '00'
        }
    };
    
    // 初始化函数
    function init() {
        initWindowPosition();
        updateCountdown();
        updateCurrentTime();
        createBubbles();
        setupEventListeners();
        startIntervals();
        
        // 初始动画
        setTimeout(() => {
            elements.mainWindow.style.opacity = '1';
            elements.mainWindow.style.transform = 'translate(-50%, -50%) scale(1)';
        }, 100);
    }
    
    // 初始化窗口位置
    function initWindowPosition() {
        const rect = elements.mainWindow.getBoundingClientRect();
        const windowWidth = rect.width;
        const windowHeight = rect.height;
        
        // 计算中心位置，确保在屏幕内
        const centerX = Math.max(0, (window.innerWidth - windowWidth) / 2);
        const centerY = Math.max(0, (window.innerHeight - windowHeight) / 2);
        
        state.windowPosition = { x: centerX, y: centerY };
        
        // 直接应用位置，不使用transform避免模糊
        elements.mainWindow.style.left = `${state.windowPosition.x}px`;
        elements.mainWindow.style.top = `${state.windowPosition.y}px`;
        elements.mainWindow.style.transform = 'none';
    }
    
    // 确保窗口在边界内
    function ensureWindowInBounds() {
        const rect = elements.mainWindow.getBoundingClientRect();
        const maxX = Math.max(0, window.innerWidth - rect.width);
        const maxY = Math.max(0, window.innerHeight - rect.height);
        
        state.windowPosition.x = Math.max(0, Math.min(state.windowPosition.x, maxX));
        state.windowPosition.y = Math.max(0, Math.min(state.windowPosition.y, maxY));
        
        elements.mainWindow.style.left = `${state.windowPosition.x}px`;
        elements.mainWindow.style.top = `${state.windowPosition.y}px`;
    }
    
    // 更新当前时间
    function updateCurrentTime() {
        const now = new Date();
        const timeString = now.toLocaleTimeString('zh-CN', { 
            hour12: false,
            hour: '2-digit',
            minute: '2-digit',
            second: '2-digit'
        });
        elements.currentTime.textContent = timeString;
    }
    
    // 更新倒计时
    function updateCountdown() {
        try {
            const now = Date.now();
            const distance = targetDate - now;
            
            if (distance <= 0) {
                if (state.countdownInterval) {
                    clearInterval(state.countdownInterval);
                }
                ['days', 'hours', 'minutes', 'seconds'].forEach(id => {
                    elements[id].textContent = '00';
                });
                
                const titleElement = document.querySelector('.vista-glass-dark h1');
                if (titleElement) {
                    titleElement.innerHTML = '<i class="fa fa-check-circle mr-2"></i>SpaceOS 6 已发布！';
                }
                return;
            }
            
            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);
            
            const formattedDays = days.toString().padStart(2, '0');
            const formattedHours = hours.toString().padStart(2, '0');
            const formattedMinutes = minutes.toString().padStart(2, '0');
            const formattedSeconds = seconds.toString().padStart(2, '0');
            
            // 仅当值变化时更新DOM
            if (formattedDays !== state.previousValues.days) {
                elements.days.textContent = formattedDays;
                state.previousValues.days = formattedDays;
                animateElement(elements.days);
            }
            
            if (formattedHours !== state.previousValues.hours) {
                elements.hours.textContent = formattedHours;
                state.previousValues.hours = formattedHours;
                animateElement(elements.hours);
            }
            
            if (formattedMinutes !== state.previousValues.minutes) {
                elements.minutes.textContent = formattedMinutes;
                state.previousValues.minutes = formattedMinutes;
                animateElement(elements.minutes);
            }
            
            if (formattedSeconds !== state.previousValues.seconds) {
                elements.seconds.textContent = formattedSeconds;
                state.previousValues.seconds = formattedSeconds;
                animateElement(elements.seconds);
            }
        } catch (error) {
            console.error('更新倒计时时出错:', error);
        }
    }
    
    // 元素动画
    function animateElement(element) {
        element.style.transform = 'scale(1.1)';
        setTimeout(() => {
            element.style.transform = 'scale(1)';
        }, 150);
    }
    
    // 气泡效果
    function createBubbles() {
        const bubbleCount = 15;
        const existingBubbles = elements.bubblesContainer.querySelectorAll('.bubble');
        
        // 保持适当数量
        if (existingBubbles.length > bubbleCount) {
            for (let i = bubbleCount; i < existingBubbles.length; i++) {
                existingBubbles[i].remove();
            }
        }
        
        // 添加新气泡
        for (let i = existingBubbles.length; i < bubbleCount; i++) {
            const bubble = document.createElement('div');
            bubble.className = 'bubble';
            
            const size = Math.random() * 15 + 6;
            const opacity = Math.random() * 0.4 + 0.2;
            const posX = Math.random() * 100;
            const posY = Math.random() * 100;
            const duration = Math.random() * 15 + 10;
            const delay = Math.random() * 5;
            
            bubble.style.width = `${size}px`;
            bubble.style.height = `${size}px`;
            bubble.style.opacity = opacity;
            bubble.style.left = `${posX}%`;
            bubble.style.top = `${posY}%`;
            bubble.style.animation = `float ${duration}s infinite ease-in-out`;
            bubble.style.animationDelay = `${delay}s`;
            
            elements.bubblesContainer.appendChild(bubble);
        }
    }
    
    // 改进的涟漪效果
    function createRipple(x, y) {
        const ripple = document.createElement('div');
        ripple.className = 'ripple';
        
        const size = Math.min(window.innerWidth, window.innerHeight) * 0.1;
        
        ripple.style.width = `${size}px`;
        ripple.style.height = `${size}px`;
        ripple.style.left = `${x - size/2}px`;
        ripple.style.top = `${y - size/2}px`;
        
        elements.rippleContainer.appendChild(ripple);
        
        // 触发动画
        requestAnimationFrame(() => {
            ripple.classList.add('animate');
        });
        
        // 清理
        setTimeout(() => {
            if (ripple.parentNode) {
                ripple.parentNode.removeChild(ripple);
            }
        }, 800);
    }
    
    // 窗口拖拽逻辑
    function startDrag(e) {
        state.isDragging = true;
        const rect = elements.mainWindow.getBoundingClientRect();
        
        // 使用clientX/clientY而不是offsetX/offsetY
        const clientX = e.clientX || e.touches[0].clientX;
        const clientY = e.clientY || e.touches[0].clientY;
        
        state.dragOffset.x = clientX - rect.left;
        state.dragOffset.y = clientY - rect.top;
        
        elements.mainWindow.style.transition = 'none';
        elements.appBody.style.cursor = 'move';
        
        // 立即应用一次位置更新
        updateWindowPosition(clientX, clientY);
        
        createRipple(clientX, clientY);
    }
    
    function updateWindowPosition(x, y) {
        if (!state.isDragging) return;
        
        state.windowPosition.x = x - state.dragOffset.x;
        state.windowPosition.y = y - state.dragOffset.y;
        
        // 应用边界检查
        ensureWindowInBounds();
        
        // 取消之前的动画帧
        if (state.animationFrameId) {
            cancelAnimationFrame(state.animationFrameId);
        }
        
        // 使用requestAnimationFrame平滑更新
        state.animationFrameId = requestAnimationFrame(() => {
            elements.mainWindow.style.left = `${state.windowPosition.x}px`;
            elements.mainWindow.style.top = `${state.windowPosition.y}px`;
        });
    }
    
    function endDrag() {
        if (!state.isDragging) return;
        
        state.isDragging = false;
        elements.appBody.style.cursor = 'default';
        elements.mainWindow.style.transition = 'all 0.3s ease-out';
        
        // 添加微小反弹效果
        setTimeout(() => {
            elements.mainWindow.style.transform = 'translate(0, 0) scale(1.02)';
            setTimeout(() => {
                elements.mainWindow.style.transform = 'translate(0, 0) scale(1)';
            }, 80);
        }, 10);
        
        if (state.animationFrameId) {
            cancelAnimationFrame(state.animationFrameId);
            state.animationFrameId = null;
        }
    }
    
    // 关闭窗口
    function closeWindow() {
        if (state.windowClosed) return;
        
        elements.mainWindow.style.opacity = '0';
        elements.mainWindow.style.transform = 'translate(-50%, -50%) scale(0.9)';
        
        setTimeout(() => {
            elements.reopenButton.style.opacity = '1';
            elements.reopenButton.style.pointerEvents = 'all';
            elements.reopenButton.style.transform = 'translateY(0)';
            elements.taskbarHint.style.opacity = '0.5';
            state.windowClosed = true;
        }, 300);
        
        createRipple(
            elements.closeBtn.getBoundingClientRect().left + 10,
            elements.closeBtn.getBoundingClientRect().top + 10
        );
    }
    
    // 重新打开窗口 - 修复溢出问题
    function reopenWindow() {
        if (!state.windowClosed) return;
        
        elements.reopenButton.style.opacity = '0';
        elements.reopenButton.style.pointerEvents = 'none';
        elements.reopenButton.style.transform = 'translateY(5px)';
        
        // 重新计算位置确保在屏幕内
        initWindowPosition();
        
        elements.mainWindow.style.opacity = '1';
        elements.mainWindow.style.transform = 'translate(-50%, -50%) scale(1)';
        
        elements.taskbarHint.style.opacity = '1';
        state.windowClosed = false;
        
        createRipple(
            elements.reopenButton.getBoundingClientRect().left + 40,
            elements.reopenButton.getBoundingClientRect().top + 20
        );
    }
    
    // 设置事件监听器
    function setupEventListeners() {
        // 窗口拖拽
        elements.titlebar.addEventListener('mousedown', startDrag);
        elements.titlebar.addEventListener('touchstart', startDrag);
        
        // 鼠标/触摸移动
        document.addEventListener('mousemove', (e) => {
            if (!state.isDragging) return;
            updateWindowPosition(e.clientX, e.clientY);
        });
        
        document.addEventListener('touchmove', (e) => {
            if (!state.isDragging || !e.touches.length) return;
            updateWindowPosition(e.touches[0].clientX, e.touches[0].clientY);
            e.preventDefault();
        });
        
        // 结束拖拽
        document.addEventListener('mouseup', endDrag);
        document.addEventListener('touchend', endDrag);
        
        // 窗口控制
        elements.closeBtn.addEventListener('click', closeWindow);
        elements.reopenButton.addEventListener('click', reopenWindow);
        
        // 全局涟漪效果
        document.addEventListener('click', (e) => {
            // 排除控制按钮区域
            if (e.target.closest('.vista-control') || e.target.closest('.vista-button')) {
                return;
            }
            createRipple(e.clientX, e.clientY);
        });
        
        // 键盘快捷键
        document.addEventListener('keydown', (e) => {
            if (e.ctrlKey && e.key === 'w') {
                if (!state.windowClosed) {
                    closeWindow();
                } else {
                    reopenWindow();
                }
                e.preventDefault();
            }
            
            if (e.key === 'Escape') {
                if (!state.windowClosed) {
                    closeWindow();
                } else {
                    reopenWindow();
                }
            }
        });
        
        // 窗口调整大小
        let resizeTimeout;
        window.addEventListener('resize', () => {
            clearTimeout(resizeTimeout);
            resizeTimeout = setTimeout(() => {
                ensureWindowInBounds();
                createBubbles();
            }, 100);
        });
        
        // 鼠标移动视差效果
        let mouseX = 0, mouseY = 0;
        elements.appBody.addEventListener('mousemove', (e) => {
            mouseX = e.clientX / window.innerWidth - 0.5;
            mouseY = e.clientY / window.innerHeight - 0.5;
            
            // 平滑的视差效果
            elements.bgImage.style.transform = `translate(${mouseX * 10}px, ${mouseY * 10}px) scale(1.02)`;
            elements.bgImage.style.transition = 'transform 0.5s ease-out';
            
            // 偶尔创建气泡
            if (Math.random() > 0.95) {
                const bubble = document.createElement('div');
                bubble.className = 'bubble';
                
                const size = Math.random() * 8 + 3;
                const opacity = Math.random() * 0.5 + 0.3;
                
                bubble.style.width = `${size}px`;
                bubble.style.height = `${size}px`;
                bubble.style.opacity = opacity;
                bubble.style.left = `${e.clientX}px`;
                bubble.style.top = `${e.clientY}px`;
                bubble.style.transform = 'translate(-50%, -50%)';
                bubble.style.animation = `float ${Math.random() * 2 + 1}s forwards ease-in-out`;
                
                elements.bubblesContainer.appendChild(bubble);
                
                setTimeout(() => {
                    if (bubble.parentNode) {
                        bubble.parentNode.removeChild(bubble);
                    }
                }, 2000);
            }
        });
    }
    
    // 启动定时器
    function startIntervals() {
        state.countdownInterval = setInterval(updateCountdown, 1000);
        state.timeInterval = setInterval(updateCurrentTime, 1000);
        state.bubbleInterval = setInterval(createBubbles, 15000);
    }
    
    // 初始化应用
    document.addEventListener('DOMContentLoaded', init);
})();
</script>
</body>
</html>
